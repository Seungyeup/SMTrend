name: smtrend-infra

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: smtrend-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9094,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9094,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true" #"false" 
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: smtrend-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
      DYNAMIC_CONFIG_ENABLED: "true"

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: smtrend-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - smtrend-minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: smtrend-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c '
      until mc alias set local http://minio:9000 minio minio123; do sleep 1; done;
      mc mb --ignore-existing local/smtrend-silver;
      mc mb --ignore-existing local/smtrend-iceberg;
      exit 0;
      '

  hive-db:
    image: postgres:15-alpine
    container_name: smtrend-hive-db
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - smtrend-hive-db:/var/lib/postgresql/data

  hive-metastore:
    image: apache/hive:3.1.3
    container_name: smtrend-hive-metastore
    user: "0:0"
    depends_on:
      - minio
      - hive-db
    ports:
      - "9083:9083"
    environment:
      SERVICE_NAME: metastore
      SKIP_SCHEMA_INIT: "true"
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-db:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
        -Dhive.metastore.schema.verification=false
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.1.0.jar:/opt/hadoop/share/hadoop/tools/lib/aws-java-sdk-bundle-1.11.271.jar
      HIVE_AUX_JARS_PATH: /opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.1.0.jar:/opt/hadoop/share/hadoop/tools/lib/aws-java-sdk-bundle-1.11.271.jar
    volumes:
      - ../03_storage/04_runtime_configs/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ../03_storage/04_runtime_configs/hadoop/core-site.xml:/opt/hive/conf/core-site.xml:ro

  trino:
    image: trinodb/trino:468
    container_name: smtrend-trino
    depends_on:
      - hive-metastore
    ports:
      - "8080:8080"
    volumes:
      - ../03_storage/04_runtime_configs/trino/etc:/etc/trino:ro
      - ../03_storage/04_runtime_configs/hadoop:/etc/hadoop/conf:ro

  flink-jobmanager:
    image: flink:1.19.1-scala_2.12-java11
    container_name: smtrend-flink-jobmanager
    depends_on:
      - kafka
    command:
      - bash
      - -lc
      - |
        if [ ! -f /opt/flink/lib/flink-sql-connector-kafka-3.2.0-1.19.jar ]; then
          wget -q -O /opt/flink/lib/flink-sql-connector-kafka-3.2.0-1.19.jar https://repo1.maven.org/maven2/org/apache/flink/flink-sql-connector-kafka/3.2.0-1.19/flink-sql-connector-kafka-3.2.0-1.19.jar
        fi
        if [ ! -f /opt/flink/lib/flink-parquet-1.19.1.jar ]; then
          wget -q -O /opt/flink/lib/flink-parquet-1.19.1.jar https://repo1.maven.org/maven2/org/apache/flink/flink-parquet/1.19.1/flink-parquet-1.19.1.jar
        fi
        if [ ! -f /opt/flink/lib/parquet-hadoop-bundle-1.13.1.jar ]; then
          wget -q -O /opt/flink/lib/parquet-hadoop-bundle-1.13.1.jar https://repo1.maven.org/maven2/org/apache/parquet/parquet-hadoop-bundle/1.13.1/parquet-hadoop-bundle-1.13.1.jar
        fi
        if [ ! -f /opt/flink/lib/hadoop-mapreduce-client-core-3.3.6.jar ]; then
          wget -q -O /opt/flink/lib/hadoop-mapreduce-client-core-3.3.6.jar https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-mapreduce-client-core/3.3.6/hadoop-mapreduce-client-core-3.3.6.jar
        fi
        if [ ! -f /opt/flink/lib/flink-s3-fs-hadoop-1.19.1.jar ]; then
          cp /opt/flink/opt/flink-s3-fs-hadoop-1.19.1.jar /opt/flink/lib/flink-s3-fs-hadoop-1.19.1.jar
        fi
        exec /docker-entrypoint.sh jobmanager
    ports:
      - "8081:8081"
    environment:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      AWS_REGION: us-east-1
      HADOOP_CONF_DIR: /etc/hadoop/conf
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
    volumes:
      - ../02_processing:/opt/flink/sql:ro
      - ../03_storage/04_runtime_configs/hadoop:/etc/hadoop/conf:ro

  flink-taskmanager:
    image: flink:1.19.1-scala_2.12-java11
    container_name: smtrend-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command:
      - bash
      - -lc
      - |
        if [ ! -f /opt/flink/lib/flink-sql-connector-kafka-3.2.0-1.19.jar ]; then
          wget -q -O /opt/flink/lib/flink-sql-connector-kafka-3.2.0-1.19.jar https://repo1.maven.org/maven2/org/apache/flink/flink-sql-connector-kafka/3.2.0-1.19/flink-sql-connector-kafka-3.2.0-1.19.jar
        fi
        if [ ! -f /opt/flink/lib/flink-parquet-1.19.1.jar ]; then
          wget -q -O /opt/flink/lib/flink-parquet-1.19.1.jar https://repo1.maven.org/maven2/org/apache/flink/flink-parquet/1.19.1/flink-parquet-1.19.1.jar
        fi
        if [ ! -f /opt/flink/lib/parquet-hadoop-bundle-1.13.1.jar ]; then
          wget -q -O /opt/flink/lib/parquet-hadoop-bundle-1.13.1.jar https://repo1.maven.org/maven2/org/apache/parquet/parquet-hadoop-bundle/1.13.1/parquet-hadoop-bundle-1.13.1.jar
        fi
        if [ ! -f /opt/flink/lib/hadoop-mapreduce-client-core-3.3.6.jar ]; then
          wget -q -O /opt/flink/lib/hadoop-mapreduce-client-core-3.3.6.jar https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-mapreduce-client-core/3.3.6/hadoop-mapreduce-client-core-3.3.6.jar
        fi
        if [ ! -f /opt/flink/lib/flink-s3-fs-hadoop-1.19.1.jar ]; then
          cp /opt/flink/opt/flink-s3-fs-hadoop-1.19.1.jar /opt/flink/lib/flink-s3-fs-hadoop-1.19.1.jar
        fi
        exec /docker-entrypoint.sh taskmanager
    environment:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      AWS_REGION: us-east-1
      HADOOP_CONF_DIR: /etc/hadoop/conf
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - ../02_processing:/opt/flink/sql:ro
      - ../03_storage/04_runtime_configs/hadoop:/etc/hadoop/conf:ro

volumes:
  smtrend-minio-data:
  smtrend-hive-db:
