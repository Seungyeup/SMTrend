[DEFAULT]
# 여러 모듈에서 공통으로 재사용할 수 있는 기본값.

[01_ingestion]
# 01_ingestion/main.py 가 읽는 로컬 전용 설정.
# 우선순위는 CLI 인자 > 환경변수 > 이 파일 > 코드 기본값 순서다.

# Finnhub Quote API 호출에 사용할 API Key
# - 무료 플랜은 분당 60회 호출 제한이 있다. 초과하면 HTTP 429가 날 수 있다.
# - 플랜과 별개로 초당 30회 hard cap도 있다고 문서에 안내되어 있다.
# - Quote API는 미국 주식 실시간 조회 기준이다. 한국 시장(KRX) 용도로는 맞지 않는다.
# - Finnhub 문서도 constant polling 보다는 websocket 사용을 권장한다.
# - 현재 01_ingestion 기본 interval 은 2초라서 단일 프로세스 기준 분당 약 30회 호출이다.
FINNHUB_API_KEY=d4epft9r01qjq397nko0d4epft9r01qjq397nkog

# FRED observations API 호출에 사용할 API Key
# - 기본 수집 지표는 DFF(금리), CPIAUCSL(물가), UNRATE(실업률) 3개다.
# - FRED value 필드는 문자열로 오므로 코드에서 float 로 변환해서 사용한다.
# - 이 1차 구현은 각 series의 최근 관측값 몇 개만 가져와 Kafka로 보내는 용도다.
FRED_API_KEY=2a4196972faf4d0429dd0b2be60228bd

# 로컬 Kafka bootstrap server
KAFKA_BOOTSTRAP_SERVERS=localhost:9092
